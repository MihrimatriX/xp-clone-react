<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#0846c9"/>
      <stop offset=".2" stop-color="#1d66e0"/>
      <stop offset=".4" stop-color="#4a92ee"/>
      <stop offset=".53" stop-color="#8bbff6"/>
      <stop offset=".62" stop-color="#c3e0fb"/>
    </linearGradient>
    <linearGradient id="far" x2="0" y2="1">
      <stop offset="0" stop-color="#78b83f"/>
      <stop offset=".3" stop-color="#4f9426"/>
      <stop offset="1" stop-color="#2c6a14"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="610" x2="0" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#95d64a"/>
      <stop offset=".18" stop-color="#67b52e"/>
      <stop offset=".55" stop-color="#3e9220"/>
      <stop offset="1" stop-color="#256c10"/>
    </linearGradient>
    <radialGradient id="sun" cx="640" cy="660" r="620" gradientTransform="translate(0 440) scale(1 .33)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4f07a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#d4f07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x2="0" y2="1">
      <stop offset=".6" stop-color="#0b3a05" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b3a05" stop-opacity=".35"/>
    </linearGradient>
    <filter id="puff" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="wisp" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6 3"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".0025 .035" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 .12  0 0 0 0 .32  0 0 0 0 .04  0 0 0 1.4 -.55"/>
    </filter>
    <path id="main" d="M0 830 C170 705 420 612 700 614 C985 616 1245 715 1600 805 V1200 H0Z"/>
    <clipPath id="mainClip"><use href="#main"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>

  <g filter="url(#puff)">
    <g fill="#dbe8f7" opacity=".9">
      <ellipse cx="380" cy="350" rx="230" ry="34"/>
      <ellipse cx="1000" cy="252" rx="160" ry="22"/>
      <ellipse cx="1385" cy="378" rx="110" ry="16"/>
    </g>
    <g fill="#fff">
      <ellipse cx="290" cy="318" rx="130" ry="44"/>
      <ellipse cx="375" cy="282" rx="105" ry="66"/>
      <ellipse cx="455" cy="300" rx="115" ry="52"/>
      <ellipse cx="530" cy="326" rx="85" ry="30"/>
      <ellipse cx="225" cy="336" rx="85" ry="26"/>
      <ellipse cx="935" cy="236" rx="115" ry="34"/>
      <ellipse cx="1005" cy="212" rx="85" ry="44"/>
      <ellipse cx="1075" cy="232" rx="100" ry="32"/>
      <ellipse cx="1350" cy="366" rx="85" ry="22"/>
      <ellipse cx="1410" cy="352" rx="62" ry="26"/>
    </g>
  </g>
  <g fill="#fff" filter="url(#wisp)">
    <ellipse cx="720" cy="420" rx="260" ry="9" opacity=".55"/>
    <ellipse cx="1240" cy="468" rx="190" ry="7" opacity=".45"/>
    <ellipse cx="160" cy="470" rx="150" ry="6" opacity=".4"/>
  </g>

  <path d="M520 770 C800 650 1120 620 1600 652 V1200 H520Z" fill="url(#far)"/>
  <use href="#main" fill="url(#hill)"/>
  <rect width="1600" height="1200" fill="url(#sun)" clip-path="url(#mainClip)"/>
  <rect width="1600" height="1200" filter="url(#grain)" clip-path="url(#mainClip)" opacity=".55"/>
  <rect width="1600" height="1200" fill="url(#shade)" clip-path="url(#mainClip)"/>
</svg>
